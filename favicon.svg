<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Cyan gradient for top face -->
    <linearGradient id="favTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <!-- Magenta/Purple gradient for left face -->
    <linearGradient id="favLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <!-- Violet gradient for right face -->
    <linearGradient id="favRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isometric 3D Voxel Glass Cube -->
  <g transform="translate(32, 32)">
    <!-- Top Face -->
    <polygon points="0,-24 24,-12 0,0 -24,-12" fill="url(#favTop)" opacity="0.9" />
    <!-- Pixel grid accents on top -->
    <polygon points="0,-18 12,-12 0,-6 -12,-12" fill="#bae6fd" opacity="0.75" />
    <polygon points="0,-12 6,-9 0,-6 -6,-9" fill="#ffffff" opacity="0.9" />

    <!-- Left Face with stepped grass fringe -->
    <polygon points="-24,-12 0,0 0,24 -24,12" fill="url(#favLeft)" opacity="0.85" />
    <!-- Fringe highlight -->
    <polygon points="-24,-12 0,0 0,6 -6,3 -6,7 -12,4 -12,8 -18,5 -18,9 -24,6" fill="#38bdf8" opacity="0.75" />

    <!-- Right Face -->
    <polygon points="0,0 24,-12 24,12 0,24" fill="url(#favRight)" opacity="0.7" />
    <polygon points="0,0 24,-12 24,-6 18,-3 18,1 12,-2 12,2 6,-1 6,3 0,6" fill="#38bdf8" opacity="0.7" />

    <!-- Outer Rim Glow Outline -->
    <polygon points="0,-24 24,-12 24,12 0,24 -24,12 -24,-12" fill="none" stroke="#f0abfc" stroke-width="1.5" stroke-linejoin="round" filter="url(#favGlow)" />

    <!-- Inner 'dp' circle emblem on left face -->
    <ellipse cx="-12" cy="11" rx="7" ry="9" fill="none" stroke="#fdf4ff" stroke-width="1.2" transform="rotate(-15, -12, 11)" />
    <!-- 'dp' initials -->
    <text x="-12" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="8" fill="#ffffff" text-anchor="middle">dp</text>
  </g>
</svg>
